spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/guardian_order}
spring.datasource.username=${DB_USERNAME:guardian}
spring.datasource.password=${DB_PASSWORD:guardian}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8082
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.guardian.order_service.infrastructure.event.PaymentApprovedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false