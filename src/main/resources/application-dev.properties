spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/guardian_order}
spring.datasource.username=${DB_USERNAME:guardian}
spring.datasource.password=${DB_PASSWORD:guardian}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8082
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}